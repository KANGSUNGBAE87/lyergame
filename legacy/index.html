<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>라이어 게임</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    color: #fff;
    -webkit-user-select: none;
    user-select: none;
  }
  #app { width: 100%; height: 100%; position: relative; overflow: hidden; }
  .screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px 16px;
    transition: opacity 0.3s;
  }
  .screen.hidden { display: none; }
  .title {
    font-size: 42px;
    font-weight: 900;
    background: linear-gradient(45deg, #ff006e, #ffbe0b, #fb5607);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    margin: 0 0 8px;
    letter-spacing: -1px;
  }
  .subtitle {
    font-size: 16px;
    color: #b8b8d4;
    margin: 0 0 32px;
    text-align: center;
  }
  .section-label {
    font-size: 20px;
    color: #fff;
    margin: 0 0 20px;
    text-align: center;
    font-weight: 600;
  }
  .number-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 380px;
  }
  .number-btn {
    aspect-ratio: 1;
    border: none;
    border-radius: 18px;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(145deg, #6a5acd, #483d8b);
    box-shadow: 0 6px 20px rgba(106, 90, 205, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  .number-btn:active {
    transform: scale(0.93);
    box-shadow: 0 2px 8px rgba(106, 90, 205, 0.4);
  }
  .number-btn .n { font-size: 32px; line-height: 1; }
  .number-btn .label { font-size: 12px; opacity: 0.8; margin-top: 4px; font-weight: 500; }

  #game-screen .header {
    position: absolute;
    top: 16px; left: 0; right: 0;
    text-align: center;
  }
  #game-screen .game-title { font-size: 18px; color: #b8b8d4; margin: 0; }
  #game-screen .progress {
    font-size: 14px; color: #ffbe0b; margin-top: 4px;
    font-weight: 600;
  }
  .cards-area {
    width: 100%;
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 80px 8px 20px;
    max-width: 480px;
  }
  .card {
    position: relative;
    width: calc(33.333% - 8px);
    aspect-ratio: 2/3;
    max-width: 130px;
    min-width: 80px;
    border-radius: 14px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff006e, #8338ec);
    box-shadow: 0 8px 24px rgba(131, 56, 236, 0.5), inset 0 0 0 3px rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
  }
  .card:active:not(.used) { transform: scale(0.95); }
  .card.used { pointer-events: none; }
  .card::before {
    content: "?";
    font-size: 48px; font-weight: 900; color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .card .card-num {
    position: absolute;
    bottom: 8px;
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.25);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .card.exploding { animation: explode 0.6s ease-out forwards; }
  @keyframes explode {
    0%   { transform: scale(1); opacity: 1; }
    40%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0.2) rotate(45deg); opacity: 0; }
  }
  .particle {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1000;
  }
  @keyframes fly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
  }

  /* ============ PEEK MODAL ============ */
  .peek-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .peek-modal.active {
    opacity: 1;
    pointer-events: auto;
  }
  .peek-card {
    width: min(86vw, 380px);
    max-height: 82vh;
    aspect-ratio: 3/4;
    border-radius: 24px;
    background: linear-gradient(135deg, #fff 0%, #ffe0e6 100%);
    color: #1a1a2e;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 28px 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 4px rgba(255,255,255,0.1);
    transform: scale(0.6);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center;
    overflow: hidden;
    position: relative;
  }
  .peek-modal.active .peek-card { transform: scale(1); }

  .peek-card .pc-category {
    font-size: 16px;
    font-weight: 700;
    color: #8338ec;
    letter-spacing: 1px;
    margin-bottom: 16px;
    padding: 6px 16px;
    background: rgba(131, 56, 236, 0.1);
    border-radius: 100px;
  }
  .peek-card .pc-word {
    font-size: 64px;
    font-weight: 900;
    color: #1a1a2e;
    line-height: 1.1;
    letter-spacing: -2px;
    word-break: keep-all;
    padding: 0 4px;
  }

  /* Liar variant - 캐릭터 크게, 텍스트 최소화 */
  .peek-card.liar {
    background: linear-gradient(135deg, #ff006e 0%, #8b0000 100%);
    color: #fff;
    justify-content: center;
    gap: 8px;
  }
  .peek-card.liar .pc-liar-label {
    font-size: 56px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    animation: wobble 0.7s ease-in-out infinite alternate;
    margin: 0;
  }
  @keyframes wobble {
    from { transform: rotate(-2deg); }
    to   { transform: rotate(2deg); }
  }

  .liar-svg {
    width: min(75vw, 280px);
    height: auto;
    animation: float 2.4s ease-in-out infinite;
    filter: drop-shadow(0 8px 22px rgba(0,0,0,0.4));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  /* Done screen */
  #done-screen .big-title {
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(45deg, #ff006e, #ffbe0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    margin: 0 0 12px;
    letter-spacing: -1px;
    animation: pop 0.6s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  #done-screen .done-sub {
    font-size: 16px; color: #b8b8d4; text-align: center;
    margin: 0 0 32px;
    line-height: 1.5;
  }
  #done-screen .category-hint {
    font-size: 18px;
    color: #ffbe0b;
    font-weight: 700;
    background: rgba(255, 190, 11, 0.1);
    padding: 10px 24px;
    border-radius: 100px;
    border: 1px solid rgba(255, 190, 11, 0.3);
    margin-bottom: 28px;
  }
  .primary-btn {
    border: none;
    background: linear-gradient(145deg, #ff006e, #8338ec);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    padding: 16px 40px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255, 0, 110, 0.4);
    transition: transform 0.15s;
  }
  .primary-btn:active { transform: scale(0.95); }
  .ghost-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: #b8b8d4;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 50px;
    margin-top: 16px;
    cursor: pointer;
  }

  .footer-tip {
    position: absolute;
    bottom: 14px; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
  }

  @media (max-height: 640px) {
    .title { font-size: 34px; }
    .number-btn .n { font-size: 24px; }
    .peek-card .pc-word { font-size: 52px; }
    .peek-card.liar .pc-liar-label { font-size: 46px; }
    .liar-svg { width: min(65vw, 220px); }
  }
  @media (max-width: 360px) {
    .peek-card .pc-word { font-size: 48px; }
    .peek-card.liar .pc-liar-label { font-size: 44px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="screen">
    <h1 class="title">라이어 게임</h1>
    <p class="subtitle">진행자 없이 카드를 한 번씩 눌러주세요</p>
    <p class="section-label">인원수를 선택하세요</p>
    <div class="number-grid" id="number-grid"></div>
    <div class="footer-tip">최소 3명 · 최대 10명</div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen hidden">
    <div class="header">
      <p class="game-title">자기 카드를 한 번만 눌러 확인하세요</p>
      <p class="progress" id="progress">0 / 0 확인 완료</p>
    </div>
    <div class="cards-area" id="cards-area"></div>
  </div>

  <!-- DONE SCREEN -->
  <div id="done-screen" class="screen hidden">
    <h1 class="big-title">라이어가<br>정해졌습니다!</h1>
    <p class="done-sub" style="margin-bottom:32px;">이제 게임을 시작하세요.<br>한 명씩 단어와 관련된 설명을 해주세요.</p>
    <button class="primary-btn" id="restart-btn">다시 시작</button>
    <button class="ghost-btn" id="reveal-btn">정답 확인하기</button>
    <div class="footer-tip">정답을 확인하려면 모두 모인 자리에서 누르세요</div>
  </div>

  <!-- PEEK MODAL -->
  <div id="peek-modal" class="peek-modal">
    <div id="peek-card" class="peek-card"></div>
  </div>
</div>

   Liar SVG - 더 크고 표현이 풍부한 거짓말쟁이 캐릭터

let state = {
  playerCount: 0,
  liarIndex: -1,
  category: "",
  word: "",
  revealed: [],
  isPeeking: false,
};

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function buildNumberGrid() {
  const grid = document.getElementById("number-grid");
  grid.innerHTML = "";
  for (let n = 3; n <= 10; n++) {
    const btn = document.createElement("button");
    btn.className = "number-btn";
    btn.innerHTML = `<span class="n">${n}</span><span class="label">명</span>`;
    btn.addEventListener("click", () => startGame(n));
    grid.appendChild(btn);
  }
}

function startGame(count) {
  state.playerCount = count;
  const cat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
  const words = WORDS[cat];
  const word = words[Math.floor(Math.random() * words.length)];
  state.category = cat;
  state.word = word;
  state.liarIndex = Math.floor(Math.random() * count);
  state.revealed = new Array(count).fill(false);

  buildCards();
  updateProgress();
  showScreen("game-screen");
}

function buildCards() {
  const area = document.getElementById("cards-area");
  area.innerHTML = "";
  for (let i = 0; i < state.playerCount; i++) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.idx = i;
    const num = document.createElement("div");
    num.className = "card-num";
    num.textContent = `${i + 1}번`;
    card.appendChild(num);
    card.addEventListener("click", () => onCardClick(i, card));
    area.appendChild(card);
  }
}

function onCardClick(idx, cardEl) {
  if (state.isPeeking) return;
  if (state.revealed[idx]) return;
  state.isPeeking = true;
  state.revealed[idx] = true;

  showPeekModal(idx === state.liarIndex);

  setTimeout(() => {
    hidePeekModal();
    setTimeout(() => {
      cardEl.classList.add("exploding");
      spawnParticles(cardEl);
      setTimeout(() => {
        cardEl.style.visibility = "hidden";
        cardEl.classList.add("used");
        state.isPeeking = false;
        updateProgress();
        if (state.revealed.every(Boolean)) {
          setTimeout(showDoneScreen, 400);
        }
      }, 600);
    }, 250);
  }, 2000);
}

function showPeekModal(isLiar) {
  const modal = document.getElementById("peek-modal");
  const card = document.getElementById("peek-card");
  if (isLiar) {
    card.classList.add("liar");
    card.innerHTML = `
      ${LIAR_SVG}
      <div class="pc-liar-label">라이어!</div>
    `;
  } else {
    card.classList.remove("liar");
    card.innerHTML = `
      <div class="pc-category">${escapeHTML(state.category)}</div>
      <div class="pc-word">${escapeHTML(state.word)}</div>
    `;
  }
  modal.classList.add("active");
}

function hidePeekModal() {
  document.getElementById("peek-modal").classList.remove("active");
}

function escapeHTML(s) {
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function spawnParticles(cardEl) {
  const rect = cardEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const colors = ["#ff006e", "#ffbe0b", "#fb5607", "#8338ec", "#3a86ff"];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = cx + "px";
    p.style.top = cy + "px";
    p.style.background = colors[i % colors.length];
    const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.4;
    const dist = 80 + Math.random() * 60;
    p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
    p.style.setProperty("--ty", Math.sin(angle) * dist + "px");
    p.style.animation = `fly 0.7s ease-out forwards`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

function updateProgress() {
  const done = state.revealed.filter(Boolean).length;
  document.getElementById("progress").textContent = `${done} / ${state.playerCount} 확인 완료`;
}

function showDoneScreen() {
  document.getElementById("reveal-btn").textContent = "정답 확인하기";
  showScreen("done-screen");
}

document.addEventListener("DOMContentLoaded", () => {
  buildNumberGrid();
  document.getElementById("restart-btn").addEventListener("click", () => {
    state = { playerCount: 0, liarIndex: -1, category: "", word: "", revealed: [], isPeeking: false };
    showScreen("setup-screen");
  });
  document.getElementById("reveal-btn").addEventListener("click", function() {
    if (this.textContent === "정답 확인하기") {
      this.textContent = `정답: ${state.word} (${state.liarIndex + 1}번이 라이어)`;
    } else {
      this.textContent = "정답 확인하기";
    }
  });
});
